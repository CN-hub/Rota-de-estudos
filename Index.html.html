<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rota de Estudos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com menu hambúrguer; um painel por tela; painéis de gráficos em grade de 1 ou 2 colunas. Tema escuro é a base; o claro deriva dele. */
:root{
  --bg:#0E151D;--surface:#16202B;--surface2:#1C2836;--ink:#E5ECF4;--muted:#9BA9BA;--line:#293646;
  --accent:#43BDB3;--accent-ink:#06201E;--amber:#F0B84A;--amber-bg:#3A2D0F;--bad:#F2877F;--good:#6CC58B;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s-off:#3a4859;
  --c-study:#43BDB3;--c-quest:#7FA8EC;--c-review:#C792CC;--c-meal:#F0B84A;--c-fixed:#9BA9BA;--c-routine:#A59CE0;--c-move:#7CC574;--c-break:#8795A6;--c-free:#8795A6;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --fs:1;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EAEEF2;--surface:#FFFFFF;--surface2:#F2F5F8;--ink:#14202E;--muted:#566478;--line:#D3DAE3;
  --accent:#0B6B67;--accent-ink:#FFFFFF;--amber:#8F5F00;--amber-bg:#FBEFD2;--bad:#B3261E;--good:#1E7B45;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s-off:#c3cbd6;
  --c-study:#0B6B67;--c-quest:#2F5DA8;--c-review:#8A4B8F;--c-meal:#A66A00;--c-fixed:#566478;--c-routine:#5E57A0;--c-move:#3D8B37;--c-break:#6F7C8C;--c-free:#6F7C8C;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EAEEF2;--surface:#FFFFFF;--surface2:#F2F5F8;--ink:#14202E;--muted:#566478;--line:#D3DAE3;
  --accent:#0B6B67;--accent-ink:#FFFFFF;--amber:#8F5F00;--amber-bg:#FBEFD2;--bad:#B3261E;--good:#1E7B45;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s-off:#c3cbd6;
  --c-study:#0B6B67;--c-quest:#2F5DA8;--c-review:#8A4B8F;--c-meal:#A66A00;--c-fixed:#566478;--c-routine:#5E57A0;--c-move:#3D8B37;--c-break:#6F7C8C;--c-free:#6F7C8C;color-scheme:light}
/* acessibilidade */
:root.rf{--f-body:'Lexend',system-ui,sans-serif;--f-display:'Lexend',system-ui,sans-serif}
:root.rf body{letter-spacing:.02em;word-spacing:.08em}
:root.ls body{line-height:1.85}
:root.hc{--muted:var(--ink);--line:color-mix(in srgb,var(--ink) 75%,transparent)}
:root.hc .card,:root.hc .box,:root.hc .tile,:root.hc .qi,:root.hc .btn,:root.hc input,:root.hc select,:root.hc textarea{border-width:2px}
:root.rm *,:root.rm *::before,:root.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
:root.fo :focus-visible{outline:3px solid var(--amber);outline-offset:3px}
:root.big .btn,:root.big input:not([type=checkbox]):not([type=range]),:root.big select,:root.big .days button,:root.big .ib,:root.big .nav button{min-height:48px}
:root.big input[type=checkbox]{width:24px;height:24px}
:root.ul a{text-decoration:underline}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.app,#drawer,#auth{zoom:var(--fs)}
.app{max-width:1120px;margin:0 auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}.top h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;min-width:0}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
.ib svg{display:block}
#userChip{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:22px}h2{font-size:21px;margin-bottom:6px}h3{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,88vw);background:var(--surface);border-right:1px solid var(--line);z-index:80;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top,0px)) 14px max(16px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
#drawer[hidden],#scrim[hidden],.app[hidden],#auth[hidden]{display:none}
.dh2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dh2 .brand{display:flex;gap:10px;align-items:center;min-width:0}.dh2 svg{color:var(--accent);flex:none}
.dh2 b{font:700 17px var(--f-display)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h4{margin:14px 8px 4px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;border:0;background:none;color:var(--ink);border-radius:8px;font:500 15px var(--f-body);cursor:pointer;min-height:44px}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav button b{font:500 12px var(--f-mono);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--ink);flex:none}
.nav button[aria-current="page"] b{background:color-mix(in srgb,var(--accent-ink) 25%,transparent);color:var(--accent-ink)}
.nav button small{margin-left:auto;font:400 11px var(--f-mono);opacity:.8}
.nav .sp{width:22px;flex:none}
.dfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dfoot .who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.dfoot .who b{color:var(--ink);display:block;font-size:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;border:0;background:var(--surface);color:var(--muted);font:500 13px var(--f-body);cursor:pointer;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{padding-top:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel[hidden]{display:none}
.lead{color:var(--muted);margin:0;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile b{display:block;font:600 24px var(--f-display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.btn{font:500 14px var(--f-body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:34px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.drop strong{display:block;font:600 17px var(--f-display);margin-bottom:4px}
.drop span{color:var(--muted);font-size:13px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select{color:var(--ink);width:100%}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge{font:500 11px var(--f-mono);padding:2px 7px;border-radius:6px;background:var(--amber-bg);color:var(--amber)}
.ok{color:var(--good)}.warn{color:var(--amber)}.err{color:var(--bad)}
.q{display:flex;flex-direction:column;gap:8px}
.qi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.qi small{color:var(--muted);grid-column:1/-1;overflow-wrap:anywhere}
.prog{grid-column:1/-1;height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.drow{display:flex;flex-direction:column;gap:8px}
.drow-top{display:flex;gap:10px;align-items:center}
.drow-top input.name{flex:1;font-weight:600}
.share{font:600 18px var(--f-mono);min-width:56px;text-align:right}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.drow-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.drow-ctl input[type=number]{width:70px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.tbl td{min-width:60px;overflow-wrap:anywhere}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;max-width:100%}
.fl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fl-head input[type=search]{flex:1 1 220px}
.dh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.dh .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tp{display:flex;gap:10px;padding:7px 12px 7px 38px;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.tp .t{flex:1;min-width:0;overflow-wrap:anywhere}.tp small{color:var(--muted);display:block}
.tp .more{color:var(--accent);background:none;border:0;cursor:pointer;font-size:12px;padding:0}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.days{display:flex;gap:6px;overflow-x:auto}
.days button{flex:1 0 auto;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:500 13px var(--f-body);color:var(--muted);cursor:pointer;text-align:center}
.days button small{display:block;font:400 11px var(--f-mono)}
.days button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button{padding:5px 10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:13px;color:var(--muted);cursor:pointer;min-height:34px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fx{display:grid;gap:8px;grid-template-columns:1fr 100px 100px;align-items:end}
.fx .chips,.fx .btn{grid-column:1/-1}
.tl{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.blk time{font:500 13px var(--f-mono);color:var(--muted);padding-top:10px;font-variant-numeric:tabular-nums}
.bc{--cc:var(--c-study);border:1px solid color-mix(in srgb,var(--cc) 40%,var(--line));background:color-mix(in srgb,var(--cc) 11%,var(--surface));border-radius:10px;padding:10px 12px;min-width:0}
.bc .k{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--cc)}
.bc .tt{font-weight:600;overflow-wrap:anywhere}
.bc .sb{color:var(--muted);font-size:13px}
.bc ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.bc.done .tt,.bc.done li{text-decoration:line-through;opacity:.6}
.bc label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.bc.min{padding:6px 12px}
.t-study{--cc:var(--c-study)}.t-quest{--cc:var(--c-quest)}.t-review{--cc:var(--c-review)}.t-meal{--cc:var(--c-meal)}.t-fixed{--cc:var(--c-fixed)}.t-routine{--cc:var(--c-routine)}.t-move{--cc:var(--c-move)}.t-break{--cc:var(--c-break)}.t-free{--cc:var(--c-free)}
.note{padding:10px 12px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:600 17px var(--f-display);margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;max-width:calc(100vw - 32px);text-align:center}
#toast[hidden]{display:none}
/* login */
#auth{min-height:100%;display:grid;place-items:center;padding:28px 0}
.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.auth-card .brand{display:flex;gap:12px;align-items:center}.auth-card .brand svg{color:var(--accent);flex:none}
.auth-card .brand p{margin:0;color:var(--muted);font-size:13px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card .pw{display:flex;gap:6px}.auth-card .pw input{flex:1}
.auth-err{min-height:20px;color:var(--bad);font-size:13px}
.auth-ok{color:var(--good);font-size:13px}
/* gráficos */
.cg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.ch h3{margin-bottom:2px}.ch .ins{color:var(--muted);font-size:13px;margin:0 0 12px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hb{display:grid;gap:14px}
.hb-r{display:grid;gap:4px}
.hb-l{font-size:13px;overflow-wrap:anywhere}.hb-l small{color:var(--muted);margin-left:6px}
.hb-bar{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center}
.hb-w{background:var(--surface2);border-radius:0 4px 4px 0;height:10px}
.hb-f{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb-v{font:500 12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.vs{padding-left:36px}
.vs-plot{position:relative;height:190px;margin-bottom:6px}
.vs-g{position:absolute;left:-36px;right:0;border-top:1px solid var(--line)}
.vs-g span{position:absolute;left:0;top:-8px;background:var(--surface);padding-right:4px;font:11px var(--f-mono);color:var(--muted)}
.vs-cols{position:absolute;inset:0;display:flex;gap:6px}
.vs-col{position:relative;flex:1;min-width:0;height:100%}
.vs-stack{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:44px;display:flex;flex-direction:column-reverse}
.vs-seg{border-top:2px solid var(--surface);min-height:0}
.vs-tot{position:absolute;left:-4px;right:-4px;text-align:center;font:500 11px var(--f-mono);color:var(--ink);white-space:nowrap}
.vs-x{display:flex;gap:6px}.vs-x span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
details.dt{margin-top:12px;font-size:13px}details.dt summary{cursor:pointer;color:var(--accent);min-height:28px}
/* relatórios, acessibilidade, usuários */
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchips button{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;font:500 13px var(--f-body);cursor:pointer;min-height:38px}
.rchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt div{min-width:0}.opt b{display:block}.opt small{color:var(--muted)}
.opt input[type=checkbox]{width:22px;height:22px;flex:none}
.opt input[type=range]{width:min(220px,50%);padding:0}
@media (min-width:900px){.cg{grid-template-columns:repeat(2,minmax(0,1fr))}.cg .wide{grid-column:1/-1}}
@media (max-width:560px){
  .fx{grid-template-columns:1fr 1fr}.fx input.lb{grid-column:1/-1}
  .card{padding:14px}h2{font-size:19px}.top h1{font-size:17px}
  #userChip{display:none}.vs{padding-left:30px}.vs-g{left:-30px}
  .opt{flex-wrap:wrap}.opt input[type=range]{width:100%}
  input,select,textarea{font-size:16px}
  .tp{padding-left:14px}
}
@media (max-width:380px){.blk{grid-template-columns:44px minmax(0,1fr);gap:6px}.grid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){#drawer{animation:none}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .2s}}
</style>
<a class="skip" href="#main">Ir para o conteúdo</a>
<div id="auth" hidden></div>
<div class="app" id="app" hidden>
<header class="top">
  <button class="ib" id="menuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <div class="ttl"><h1 id="pageTitle">Rota de Estudos</h1><p id="pageSub"></p></div>

 {id:'cronograma',title:'Cronograma',desc:'Todos os blocos do dia a dia, do acordar ao dormir.',weekly:true,build(D){const rows=[],pl=D.pl,weeks=REP.week==='all'?Array.from({length:pl.P.weeks},(_,i)=>i+1):[+REP.week];

  <div class="rchips" role="group" aria-label="Relatórios">${REPORTS.map(r=>`<button data-rep="${r.id}" aria-pressed="${r.id===REP.id}">${esc(r.title)}</button>`).join('')}</div>
  <div class="card"><h3>${esc(R.r.title)}</h3><p class="lead" style="font-size:13px;margin:4px 0 12px">${esc(R.r.desc)} <b>${nf(N)}</b> linha(s).</p>${wk}
  <div class="row" style="margin-top:${wk?12:0}px">${dl?fm.map(([k,n])=>`<button class="btn primary sm" data-exp="${k}">${n}</button>`).join('')+'<button class="btn sm" data-exp="all">Todos em um Excel</button>':'<span class="note">A exportação de arquivos não está disponível nesta visualização. Abra o aplicativo pelo link original para exportar.</span>'}</div></div>
  <div class="card scroll"><table class="tbl"><thead><tr>${R.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${R.rows.slice(0,LIM).map(r=>`<tr>${r.map(c=>`<td>${esc(cell(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${N>LIM?`<p class="lead" style="font-size:13px">Prévia com ${LIM} de ${nf(N)} linhas. A exportação inclui todas.</p>`:''}`;}
document.addEventListener('click',e=>{const r=e.target.closest('[data-rep]');if(r){REP.id=r.dataset.rep;return renderRelatorios();}const x=e.target.closest('[data-exp]');if(x)doExport(x.dataset.exp);});
document.addEventListener('change',e=>{if(e.target.id==='repWeek'){REP.week=e.target.value;renderRelatorios();}});
/* ---------- Casca do aplicativo: tema, acessibilidade, menu e inicialização ---------- */
let themeMode=dGet('theme')||'dark';
const isDark=()=>themeMode==='dark'||(themeMode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){const r=document.documentElement;if(themeMode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',themeMode);
  const ic=$('#themeIco');if(ic)ic.innerHTML=isDark()?'<circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10H4M16 10h2.5M4 4l1.8 1.8M14.2 14.2L16 16M16 4l-1.8 1.8M5.8 14.2L4 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'<path d="M16.5 11.5A7 7 0 018.5 3.5a7 7 0 108 8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
  const b=$('#themeBtn');if(b)b.setAttribute('aria-label',isDark()?'Mudar para o tema claro':'Mudar para o tema escuro');}
function setTheme(m){themeMode=m;dSet('theme',m);applyTheme();if(S.user)renderSteps();if(!$('#auth').hidden)renderAuth();}
const A11_DEF={fs:100,ls:false,rf:false,hc:false,rm:false,fo:false,big:false,ul:false};
let A11=Object.assign({},A11_DEF,{rm:!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)},dGet('a11y')||{});
function applyA11(){const r=document.documentElement;r.style.setProperty('--fs',String(A11.fs/100));for(const k of ['ls','rf','hc','rm','fo','big','ul'])r.classList.toggle(k,!!A11[k]);}
function setA11(k,v){A11[k]=v;dSet('a11y',A11);applyA11();}
const SPEECH='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(text){if(!SPEECH)return toast('A leitura em voz alta não está disponível neste navegador');speechSynthesis.cancel();
  const parts=String(text).replace(/\s+/g,' ').match(/.{1,220}(?:\s|$)/g)||[];for(const p of parts){const u=new SpeechSynthesisUtterance(p);u.lang='pt-BR';u.rate=.95;speechSynthesis.speak(u);}}
function renderAcessib(){const el=$('#tab-acessib');
  const sw=(k,t,d)=>`<div class="opt"><div><b>${t}</b><small>${d}</small></div><input type="checkbox" data-a="${k}" ${A11[k]?'checked':''} aria-label="${t}"></div>`;
  el.innerHTML=`<div><h2>Acessibilidade</h2><p class="lead">Ajuste a leitura e a navegação ao seu jeito. As escolhas ficam salvas neste aparelho.</p></div>
  <div class="card"><div class="opt"><div><b>Tamanho do texto</b><small>${A11.fs}% do tamanho padrão</small></div><div class="row"><button class="btn sm" data-fsd="-10" aria-label="Diminuir texto">A−</button><input type="range" id="fsr" min="85" max="150" step="5" value="${A11.fs}" aria-label="Tamanho do texto"><button class="btn sm" data-fsd="10" aria-label="Aumentar texto">A+</button></div></div>
  ${sw('rf','Fonte de leitura facilitada','Usa uma fonte desenhada para leitura mais fluida, com mais espaço entre letras e palavras.')}
  ${sw('ls','Espaçamento amplo entre linhas','Deixa os textos mais arejados.')}
  ${sw('hc','Alto contraste','Reforça textos e bordas.')}
  ${sw('big','Botões e campos maiores','Alvos de toque de pelo menos 48 px.')}
  ${sw('fo','Destacar o foco do teclado','Contorno grosso no item selecionado ao navegar com a tecla Tab.')}
  ${sw('ul','Sublinhar links','Links sempre sublinhados.')}
  ${sw('rm','Reduzir animações','Remove transições e movimentos.')}</div>
  <div class="card"><h3>Leitura em voz alta</h3><p class="lead" style="font-size:13px;margin:4px 0 12px">${SPEECH?'Usa a voz do seu aparelho, em português.':'Este navegador não oferece leitura em voz alta.'}</p>
  <div class="row"><button class="btn primary" data-say="screen" ${SPEECH?'':'disabled'}>Ler a tela atual</button><button class="btn" data-say="day" ${SPEECH?'':'disabled'}>Ler a rotina do dia</button><button class="btn" data-say="stop" ${SPEECH?'':'disabled'}>Parar</button></div></div>
  <div class="row"><button class="btn" data-a11reset>Restaurar padrões</button></div>`;}
/* menu */
let menuFrom=null;
function openMenu(){renderSteps();menuFrom=document.activeElement;$('#drawer').hidden=false;$('#scrim').hidden=false;$('#menuBtn').setAttribute('aria-expanded','true');
  const c=$('#drawer [aria-current="page"]')||$('#drawer button');if(c)c.focus();}
function closeMenu(quiet){const d=$('#drawer');if(!d||d.hidden)return;d.hidden=true;$('#scrim').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');if(!quiet&&menuFrom&&menuFrom.focus)menuFrom.focus();}
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('#menuBtn'))return $('#drawer').hidden?openMenu():closeMenu();
  if(t.closest('#closeMenu')||t.id==='scrim')return closeMenu();
  if(t.closest('#themeBtn'))return setTheme(isDark()?'light':'dark');
  const ts=t.closest('[data-theme-set]');if(ts)return setTheme(ts.dataset.themeSet);
  if(t.closest('#logoutBtn')){if(SPEECH)speechSynthesis.cancel();return logout();}
  const fd=t.closest('[data-fsd]');if(fd){setA11('fs',Math.max(85,Math.min(150,A11.fs+(+fd.dataset.fsd))));return S.user?renderAcessib():renderAuth();}
  if(t.closest('[data-a11reset]')){A11=Object.assign({},A11_DEF);dSet('a11y',A11);applyA11();return renderAcessib();}
  const sy=t.closest('[data-say]');if(sy){const w=sy.dataset.say;if(w==='stop'){if(SPEECH)speechSynthesis.cancel();return;}
    if(w==='screen'){const p=$('#tab-'+S.tab);return speak(p?p.innerText:'');}
    ensurePlan();return speak(dayText(S.plan,S.day,S.week));}});
document.addEventListener('change',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a){setA11(a,e.target.checked);}});
document.addEventListener('input',e=>{if(e.target.id==='fsr'){setA11('fs',+e.target.value);const s=e.target.closest('.opt').querySelector('small');if(s)s.textContent=A11.fs+'% do tamanho padrão';}});
document.addEventListener('keydown',e=>{const d=$('#drawer');if(!d||d.hidden)return;
  if(e.key==='Escape'){e.preventDefault();return closeMenu();}
  if(e.key==='Tab'){const f=[...d.querySelectorAll('button')].filter(b=>!b.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
/* sessão */
async function startApp(u){S.user=u;PFX=u.user+'.';
  S.profile=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),lsGet('profile')||{});S.checks=lsGet('checks')||{};
  S.st=E.newState();S.plan=null;S.dirty=true;S.week=1;S.day=0;S.queue=[];S.search='';S.open={};S.pageN={};S.expT={};S.confirm=null;S.busy=false;
  try{let s=await idb.get('state:'+PFX);if(!s&&u.user==='dev')s=await idb.get('state');if(s&&s.discs)S.st=s;}catch(e){}
  $('#auth').hidden=true;$('#app').hidden=false;$('#userChip').textContent=u.name+(u.role==='dev'?' · vitalício':'');
  go(S.st.discs.length?'dashboard':'material');}
function logout(){Auth.clear();S.user=null;PFX='';S.st=E.newState();S.plan=null;authTab='login';closeMenu(true);showAuth();}
applyTheme();applyA11();
(async()=>{const s=Auth.session();if(s){const u=Auth.get(s.u);if(u){try{await startApp(u);return;}catch(e){}}Auth.clear();}showAuth();})();
</script>

</body></html>
